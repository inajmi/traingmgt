# Optional local MySQL 8 for Trainer Tracker.
# Use it with `docker compose up -d` (the image auto-creates the database/user
# from the env vars below on first start), then run:
#   npm run db:migrate && npm run db:seed && npm run create:admin
# The app server itself is not containerized here — deployment is handled by the user.

services:
  db:
    image: mysql:8.0
    container_name: trainer-tracker-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: trainer_dev_root_pass
      MYSQL_DATABASE: trainer_tracker
      MYSQL_USER: trainer
      MYSQL_PASSWORD: trainer_dev_pass
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - trainer_tracker_mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u trainer --password=trainer_dev_pass"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  trainer_tracker_mysqldata:
